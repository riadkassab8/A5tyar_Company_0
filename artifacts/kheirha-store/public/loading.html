<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>أختيار | طعم أصيل من الزمن الجميل</title>

  <!-- Google Fonts: Alexandria & Tajawal for modern elegant typography -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Alexandria:wght@400;600;700;800&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">

  <style>
    /* ── RESET & BASE STYLES ───────────────────────────────── */
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: 'Alexandria', 'Tajawal', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: #F7F4EA;
      color: #5C3826;
    }

    /* ── CENTER CONTAINER ─────────────────────────────────── */
    .loading-screen {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem;
      background: radial-gradient(circle at 50% 45%, #FFFFFF 0%, #F5F1E4 65%, #ECE7D6 100%);
      z-index: 99999;
      overflow: hidden;
    }

    /* ── BRAND CONTAINER ──────────────────────────────────── */
    .brand-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      max-width: 95vw;
      position: relative;
      z-index: 10;
      animation: fadeInUp 0.9s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    /* ── LUXURY GOLDEN HALO AURA BEHIND LOGO ──────────────── */
    .logo-aura {
      position: absolute;
      top: 42%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 440px;
      height: 440px;
      background: radial-gradient(circle, rgba(227, 179, 60, 0.22) 0%, rgba(227, 179, 60, 0.05) 55%, transparent 75%);
      border-radius: 50%;
      pointer-events: none;
      animation: auraPulse 4s ease-in-out infinite alternate;
      z-index: -1;
    }

    .aura-ring {
      position: absolute;
      top: 42%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 320px;
      height: 320px;
      border: 1px solid rgba(227, 179, 60, 0.25);
      border-radius: 50%;
      pointer-events: none;
      animation: ringExpand 3.5s infinite ease-out;
      z-index: -1;
    }

    /* ── LOGO WITH METALLIC SHINE SWEEP ────────────────────── */
    .logo-wrapper {
      position: relative;
      margin-bottom: 2.25rem;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 2rem;
      overflow: hidden;
      padding: 10px;
    }

    .logo-img {
      width: 440px;
      max-width: 88vw;
      height: auto;
      object-fit: contain;
      filter: drop-shadow(0 16px 36px rgba(74, 46, 27, 0.12));
      display: block;
    }

    .logo-wrapper::after {
      content: '';
      position: absolute;
      top: -50%;
      left: -60%;
      width: 40%;
      height: 200%;
      background: linear-gradient(
        60deg,
        transparent 0%,
        rgba(255, 255, 255, 0) 30%,
        rgba(255, 255, 255, 0.7) 50%,
        rgba(255, 255, 255, 0) 70%,
        transparent 100%
      );
      transform: rotate(25deg);
      animation: shineSweep 4s infinite cubic-bezier(0.4, 0, 0.2, 1);
      pointer-events: none;
    }

    /* ── SLOGAN WITH EXPLICIT WARM BROWN COLOR ────────────── */
    .slogan-container {
      display: flex;
      gap: 0.5rem;
      justify-content: center;
      flex-wrap: wrap;
      margin-bottom: 2.5rem;
    }

    .word {
      font-size: 1.45rem;
      font-weight: 700;
      color: #5C3826 !important;
      letter-spacing: -0.01em;
      opacity: 0;
      filter: blur(10px);
      transform: translateY(12px);
      animation: wordBlurIn 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    .word:nth-child(1) { animation-delay: 0.2s; }
    .word:nth-child(2) { animation-delay: 0.4s; }
    .word:nth-child(3) { animation-delay: 0.6s; }
    .word:nth-child(4) { animation-delay: 0.8s; }
    .word:nth-child(5) { animation-delay: 1.0s; }

    .word.highlight {
      color: #C68A1E !important;
    }

    /* ── ELEGANT FLOATING ORB DOTS (WITH MARGIN TOP) ────────── */
    .loading-dots {
      display: flex;
      gap: 10px;
      align-items: center;
      justify-content: center;
      margin-top: 2.5rem;
      opacity: 0;
      animation: fadeIn 1s 1.2s ease forwards;
    }

    .dot {
      width: 9px;
      height: 9px;
      background: linear-gradient(135deg, #D9A52E, #5C3826);
      border-radius: 50%;
      box-shadow: 0 0 12px rgba(198, 138, 30, 0.5);
      animation: floatDot 1.6s infinite ease-in-out;
    }

    .dot:nth-child(1) { animation-delay: 0s; }
    .dot:nth-child(2) { animation-delay: 0.25s; }
    .dot:nth-child(3) { animation-delay: 0.5s; }

    /* ── KEYFRAME ANIMATIONS ──────────────────────────────── */
    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateY(24px) scale(0.95);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    @keyframes shineSweep {
      0%, 40% {
        left: -60%;
      }
      70%, 100% {
        left: 140%;
      }
    }

    @keyframes auraPulse {
      0% {
        transform: translate(-50%, -50%) scale(0.85);
        opacity: 0.4;
      }
      100% {
        transform: translate(-50%, -50%) scale(1.15);
        opacity: 0.85;
      }
    }

    @keyframes ringExpand {
      0% {
        transform: translate(-50%, -50%) scale(0.7);
        opacity: 0.8;
      }
      100% {
        transform: translate(-50%, -50%) scale(1.5);
        opacity: 0;
      }
    }

    @keyframes wordBlurIn {
      to {
        opacity: 1;
        filter: blur(0);
        transform: translateY(0);
      }
    }

    @keyframes floatDot {
      0%, 100% {
        transform: translateY(0) scale(0.7);
        opacity: 0.4;
      }
      50% {
        transform: translateY(-8px) scale(1.3);
        opacity: 1;
        box-shadow: 0 0 18px rgba(198, 138, 30, 0.8);
      }
    }

    @keyframes fadeIn {
      to { opacity: 1; }
    }

    @media (max-width: 480px) {
      .logo-img {
        width: 320px;
      }

      .word {
        font-size: 1.2rem;
      }

      .logo-aura {
        width: 300px;
        height: 300px;
      }

      .aura-ring {
        width: 240px;
        height: 240px;
      }
    }
  </style>
</head>
<body>

  <div class="loading-screen" id="loadingScreen">
    <div class="brand-container" id="brandCard">
      <div class="logo-aura"></div>
      <div class="aura-ring"></div>

      <div class="logo-wrapper">
        <img src="/logo-dark.png" alt="أختيار - خير مصري أصيل" class="logo-img" id="brandLogo">
      </div>

      <div class="slogan-container">
        <span class="word">طعم</span>
        <span class="word highlight">أصيل</span>
        <span class="word">من</span>
        <span class="word">الزمن</span>
        <span class="word highlight">الجميل</span>
      </div>

      <div class="loading-dots">
        <div class="dot"></div>
        <div class="dot"></div>
        <div class="dot"></div>
      </div>
    </div>
  </div>
</body>
</html>
